name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if ! command -v java >/dev/null 2>&1; then
            echo "::error::Java executable not found on PATH."
            exit 1
          fi

          JAVA_VERSION_OUTPUT="$(java -version 2>&1)"
          echo "${JAVA_VERSION_OUTPUT}"

          RAW_VERSION="$(printf '%s\n' "${JAVA_VERSION_OUTPUT}" | sed -nE 's/.*version "([^"]+)".*/\1/p' | head -n 1)"
          if [ -z "${RAW_VERSION}" ]; then
            echo "::error::Unable to detect active Java version."
            exit 1
          fi

          if [[ "${RAW_VERSION}" == 1.* ]]; then
            MAJOR_VERSION="$(printf '%s' "${RAW_VERSION}" | cut -d'.' -f2)"
          else
            MAJOR_VERSION="$(printf '%s' "${RAW_VERSION}" | sed -nE 's/^([0-9]+).*/\1/p')"
          fi

          if ! [[ "${MAJOR_VERSION}" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse active Java major version from '${RAW_VERSION}'."
            exit 1
          fi

          echo "Detected Java major version: ${MAJOR_VERSION}"
          if [ "${MAJOR_VERSION}" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${MAJOR_VERSION}."
            exit 1
          fi
          echo "Confirmed Java ${MAJOR_VERSION} meets requirement (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "${KEYSTORE_PATH}" ]; then
            echo "Debug keystore already exists; skipping generation."
          elif [ -f "./debug.keystore.base64" ]; then
            base64 -d ./debug.keystore.base64 > "${KEYSTORE_PATH}"
            echo "Decoded project debug.keystore from debug.keystore.base64 (preserves Firebase Google Sign-In SHA fingerprint)."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "${KEYTOOL_BIN}" ]; then
              echo "::error::keytool not found under configured JAVA_HOME (${KEYTOOL_BIN})."
              exit 1
            fi
            "${KEYTOOL_BIN}" -genkeypair \
              -noprompt \
              -keystore "${KEYSTORE_PATH}" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "${KEYSTORE_PATH}" ] || [ ! -s "${KEYSTORE_PATH}" ]; then
            echo "::error::Failed to verify debug keystore at ${KEYSTORE_PATH}."
            exit 1
          fi
          echo "Debug keystore is ready."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          APK_DIR="app/build/outputs/apk"

          if [ ! -e "${EXPECTED_APK}" ]; then
            echo "::error::Expected debug APK not found at ${EXPECTED_APK}."
            if [ -d "${APK_DIR}" ]; then
              echo "APK files discovered inside ${APK_DIR}:"
              find "${APK_DIR}" -type f -name '*.apk' -print || true
            else
              echo "Directory ${APK_DIR} does not exist."
            fi
            exit 1
          fi

          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} exists but is not a regular file."
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi

          if [[ "${EXPECTED_APK}" != *.apk ]]; then
            echo "::error::${EXPECTED_APK} does not have the .apk extension."
            exit 1
          fi

          echo "Verified debug APK: ${EXPECTED_APK}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "${SOURCE_APK}" ] || [ ! -s "${SOURCE_APK}" ] || [[ "${SOURCE_APK}" != *.apk ]]; then
            echo "::error::Verified debug APK is missing or invalid at ${SOURCE_APK}."
            exit 1
          fi

          TEMP_RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP}/release-apk-XXXXXX")"
          ASSET_NAME="darbar-debug.apk"
          ASSET_PATH="${TEMP_RELEASE_DIR}/${ASSET_NAME}"

          cp -- "${SOURCE_APK}" "${ASSET_PATH}"

          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ] || [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "::error::Prepared release APK asset is missing or invalid at ${ASSET_PATH}."
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=${ASSET_NAME}" >> "${GITHUB_OUTPUT}"
          echo "Prepared release asset: ${ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::GitHub CLI (gh) is not available on this runner."
            exit 1
          fi
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ] || [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "::error::Prepared release asset is missing, empty, or not an .apk file."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "release_title=${RELEASE_TITLE}" >> "${GITHUB_OUTPUT}"

          RELEASE_NOTES="$(printf '%s\n' \
            "This is an automatically generated debug APK built by GitHub Actions." \
            "" \
            "- GitHub Actions run number: ${GITHUB_RUN_NUMBER}" \
            "- GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}" \
            "- Source commit SHA: ${GITHUB_SHA}" \
            "- APK asset: ${ASSET_NAME}" \
            "" \
            "Important notes:" \
            "- This APK is intended for testing." \
            "- This APK is not a Play Store production release." \
            "- This APK is signed only with a temporary debug keystore.")"

          gh release create "${RELEASE_TAG}" \
            "${ASSET_PATH}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            --latest

      - name: Report APK download result
        if: ${{ always() && (steps.publish_release.outcome == 'success' || steps.publish_release.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          REPORTED_SUCCESS="false"
          RELEASE_URL=""

          if [ "${RELEASE_OUTCOME}" = "success" ] && [ -n "${RELEASE_TAG:-}" ]; then
            if RELEASE_URL="$(gh release view "${RELEASE_TAG}" --json url --jq '.url' 2>/dev/null)" && [ -n "${RELEASE_URL}" ]; then
              REPORTED_SUCCESS="true"
            fi
          fi

          if [ "${REPORTED_SUCCESS}" = "true" ]; then
            echo "GitHub Release published successfully."
            echo "Release tag: ${RELEASE_TAG}"
            echo "Release title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK asset filename: ${ASSET_NAME}"

            {
              echo "### Debug APK Build & GitHub Release"
              echo ""
              echo "- **Status:** Debug APK built, artifact uploaded, and GitHub Release published."
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
              echo "- **Direct GitHub Release Page:** ${RELEASE_URL}"
              echo ""
              echo "Download the APK directly from the **Assets** section on the GitHub Release page above."
              echo ""
              echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available on this workflow run as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build and artifact upload succeeded. Download the APK from the GitHub Actions artifact named 'app-debug-apk'."
            {
              echo "### Debug APK Build Result (Release Publishing Warning)"
              echo ""
              echo "> **Warning:** Publishing the GitHub Release did not succeed."
              echo ""
              echo "- **APK Build Status:** Succeeded"
              echo "- **Backup Download:** The GitHub Actions artifact named \`app-debug-apk\` was uploaded successfully and remains available in the **Artifacts** section of this workflow run."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
